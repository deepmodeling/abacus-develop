calculation:
  type: md
  driver: abacus_native
  init_structure: inputs/init.traj
  steps: 5
  directory: run_md_si_abacus_native
  trajectory: md_si_abacus_native.traj
  summary_file: md_si_abacus_native_summary.json
  final_structure: md_si_abacus_native_final.traj
  artifact_manifest: atst_artifacts_md_si_abacus_native.json
  poll_interval_seconds: 5.0
  postprocess:
    summary:
      enabled: true
      output: md_si_abacus_native_post_summary.json
    convert:
      enabled: false
      format: extxyz
      output_prefix: md_si_abacus_native_post

calculator:
  name: abacus
  abacus:
    command: abacus
    mpi: 1
    omp: 1
    directory: run_md_si_abacus_native
    kpts: [1, 1, 1]
    parameters:
      calculation: md
      basis_type: lcao
      ks_solver: genelpa
      ecutwfc: 100
      dft_functional: pbe
      symmetry: 0
      scf_thr: 1e-6
      scf_nmax: 100
      smearing_method: gaussian
      smearing_sigma: 0.001
      mixing_type: broyden
      cal_force: 1
      cal_stress: 1
      init_wfc: atomic
      init_chg: atomic
      md_type: nvt
      md_nstep: 5
      md_dt: 0.5
      md_tfirst: 300
      pseudo_dir: ../../../../../tests/PP_ORB
      orbital_dir: ../../../../../tests/PP_ORB
      pseudopotentials:
        Si: Si_ONCV_PBE-1.0.upf
      basissets:
        Si: Si_gga_8au_100Ry_2s2p1d.orb
