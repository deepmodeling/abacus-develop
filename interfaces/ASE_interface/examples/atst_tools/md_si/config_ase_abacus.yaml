calculation:
  type: md
  driver: ase
  init_structure: inputs/init.traj
  ensemble: nvt
  algorithm: langevin
  steps: 5
  timestep_fs: 0.5
  temperature_K: 300.0
  friction_fs_inv: 0.01
  seed: 7
  trajectory: md_si_ase_abacus.traj
  logfile: md_si_ase_abacus.log
  summary_file: md_si_ase_abacus_summary.json
  final_structure: md_si_ase_abacus_final.traj
  artifact_manifest: atst_artifacts_md_si_ase_abacus.json
  postprocess:
    summary:
      enabled: true
      output: md_si_ase_abacus_post_summary.json
    convert:
      enabled: false
      format: extxyz
      output_prefix: md_si_ase_abacus_post

calculator:
  name: abacus
  abacus:
    command: abacus
    mpi: 1
    omp: 1
    directory: run_md_si_ase_abacus
    kpts: [1, 1, 1]
    parameters:
      calculation: scf
      basis_type: lcao
      ks_solver: genelpa
      ecutwfc: 100
      dft_functional: pbe
      symmetry: 0
      scf_thr: 1e-6
      scf_nmax: 100
      smearing_method: gaussian
      smearing_sigma: 0.001
      mixing_type: broyden
      cal_force: 1
      cal_stress: 1
      pseudo_dir: ../../../../../tests/PP_ORB
      orbital_dir: ../../../../../tests/PP_ORB
      pseudopotentials:
        Si: Si_ONCV_PBE-1.0.upf
      basissets:
        Si: Si_gga_8au_100Ry_2s2p1d.orb
