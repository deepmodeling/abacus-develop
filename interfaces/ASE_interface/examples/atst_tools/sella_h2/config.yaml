calculation:
  type: sella
  init_structure: inputs/ts_guess.extxyz
  fmax: 0.05
  max_steps: 5
  trajectory: sella_h2.traj
  eta: 0.002
  order: 1

calculator:
  name: abacus
  abacus:
    command: abacus
    mpi: 1
    omp: 1
    directory: run_sella_h2
    kpts: [1, 1, 1]
    parameters:
      calculation: scf
      basis_type: lcao
      ks_solver: genelpa
      ecutwfc: 100
      dft_functional: pbe
      symmetry: 0
      scf_thr: 1e-6
      scf_nmax: 100
      cal_force: 1
      cal_stress: 0
      pseudo_dir: ../../../../../tests/PP_ORB
      orbital_dir: ../../../../../tests/PP_ORB
      pseudopotentials:
        H: H_ONCV_PBE-1.0.upf
      basissets:
        H: H_gga_8au_100Ry_2s1p.orb
