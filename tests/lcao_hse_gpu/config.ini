[site]
name = Open Source Supercomputing Center of SAI
url = https://www.open-sai.com/
acknowledgement = Computing resources were provided by

[remote]
host = c0.sai.ai-4s.com
port = 12022
user = abacususer01
project_root = ~/abacus_hse_gpu_experiment
allowed_project_roots = /home, /org

[cluster]
partition = 16V100
mapping_root = /opt/sai_config/mps_mapping.d
disable_nccl_ib = false
poll_seconds = 10

[build]
qos = huge-gpu
nodes = 1
tasks_per_node = 4
gpus_per_node = 4
time_seconds = 3600

[resource.gpu1]
qos = flood-1o2gpu
nodes = 1
tasks_per_node = 1
gpus_per_node = 1
time_seconds = 1800
parallelism = 1

[case.001]
suite = 08_RI
name = scf_hse_gamma
resource = gpu1
runner = autotest_gpu

[case.002]
suite = 08_RI
name = scf_hse_complex_multik
resource = gpu1
runner = autotest_gpu

[case.003]
suite = 08_RI
name = scf_hse_spin2_gamma
resource = gpu1
runner = autotest_gpu
