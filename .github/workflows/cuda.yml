name: CUDA Test

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Nightly at 18:00 UTC: run the full 01_PW GPU case list. Pull requests
    # run the smaller CASES_GPU_SMOKE.txt subset instead.
    - cron: '0 18 * * *'

defaults:
  run:
    shell: bash

concurrency:
  # The matrix context is not available at workflow scope; referencing
  # matrix.suite here made the workflow fail to run entirely. Keep the
  # same per-ref cancellation semantics as before.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 鈹€鈹€ Job 1: build once, publish the binary as an artifact 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  build:
    name: Build CUDA
    runs-on: gpu
    if: github.repository_owner == 'deepmodeling'
    container:
      image: ghcr.io/deepmodeling/abacus-cuda
      volumes:
        - /tmp/ccache:/github/home/.ccache
      options: --gpus all

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install CI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache xz-utils ninja-build pkg-config

      - name: Setup ccache
        run: |
          ccache --max-size=30G
          ccache --zero-stats
          ccache -s

      - name: Install external tools from toolchain
        run: |
          cd toolchain
          ./install_abacus_toolchain_new.sh --with-dftd4=install --dry-run -j8
          ./scripts/stage4/install_stage4.sh
          cd ..

      - name: Configure & Build
        run: |
          nvidia-smi
          source toolchain/install/setup
          rm -rf build
          # Build only for the GPU architecture of the CI runner instead of
          # the default 7 architectures (60/70/75/80/86/89/90). The CI GPU
          # pool is Tesla V100 (sm_70, see the nvidia-smi output above);
          # update this if the runner GPU model changes (V100=70, A100=80,
          # H100=90, T4=75). This cuts nvcc work by ~7x and allows safe -j.
          cmake -B build -G Ninja -DUSE_CUDA=ON -DBUILD_TESTING=ON -DENABLE_FLOAT_FFTW=ON \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install"
          cmake --build build -j "$(nproc)"
          cmake --install build

      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Module_LCAO CUDA Unittests
        env:
          GTEST_COLOR: 'yes'
          OMP_NUM_THREADS: '2'
        run: |
          ctest --test-dir build -V --timeout 1700 -R '^(MODULE_LCAO_tddft_radial_interpolation_cuda_test|MODULE_LCAO_tddft_snap_psibeta_half_test)$'

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: abacus-cuda-bin
          path: install/
          retention-days: 1

  # 鈹€鈹€ Job 2: matrix instances run their test suites in parallel 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  gpu-test:
    name: Test ${{ matrix.suite }}
    needs: build
    runs-on: gpu
    if: github.repository_owner == 'deepmodeling'
    container:
      image: ghcr.io/deepmodeling/abacus-cuda
      options: --gpus all
    strategy:
      fail-fast: false
      matrix:
        suite:
          - 11_PW_GPU
          - 12_NAO_Gamma_GPU
          - 13_NAO_multik_GPU
          - 15_rtTDDFT_GPU
          - 16_SDFT_GPU
          - 01_PW

    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v7

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: abacus-cuda-bin
          path: install/

      - name: Make binary executable
        run: find install/bin -type f -exec chmod +x {} \;

      - name: Select 01_PW case list
        if: matrix.suite == '01_PW'
        run: |
          # PRs run the smoke subset; schedule/dispatch runs the full list.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "CASE_FILE=CASES_GPU_SMOKE.txt" >> "$GITHUB_ENV"
          else
            echo "CASE_FILE=CASES_GPU.txt" >> "$GITHUB_ENV"
          fi

      - name: Test ${{ matrix.suite }}
        env:
          GTEST_COLOR: 'yes'
          OMP_NUM_THREADS: '2'
        run: |
          export PATH="${GITHUB_WORKSPACE}/install/bin:${PATH}"
          cd "tests/${{ matrix.suite }}"
          if [ "${{ matrix.suite }}" = "01_PW" ]; then
            find . -name INPUT | while read f; do
                if grep -q "^device" "$f"; then
                    sed -i 's/^device.*/device    gpu/' "$f"
                else
                    echo "device    gpu" >> "$f"
                fi
            done
            # CI pods are single-GPU: keep the intentional -n 1 from #7690.
            # The speed win comes from the smoke subset, not MPI processes.
            bash ../integrate/Autotest.sh -n 1 -f "$CASE_FILE"
          else
            bash ../integrate/Autotest.sh -n 2 -f CASES_GPU.txt
          fi
