name: CUDA Test

on:
  workflow_dispatch:
  pull_request:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.suite || 'build' }}
  cancel-in-progress: true

jobs:
  # ── Job 1: 只负责编译，产出二进制 ──────────────────────────
  build:
    name: Build CUDA
    runs-on: gpu
    if: github.repository_owner == 'deepmodeling'
    container:
      image: ghcr.io/deepmodeling/abacus-cuda
      volumes:
        - /tmp/ccache:/github/home/.ccache
      options: --gpus all

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install CI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache xz-utils ninja-build pkg-config

      - name: Install external tools from toolchain
        run: |
          cd toolchain
          ./install_abacus_toolchain_new.sh --with-dftd4=install --dry-run -j8
          ./scripts/stage4/install_stage4.sh
          cd ..

      - name: Configure & Build
        run: |
          nvidia-smi
          source toolchain/install/setup
          rm -rf build
          cmake -B build -G Ninja \
            -DUSE_CUDA=ON \
            -DBUILD_TESTING=ON \
            -DENABLE_FLOAT_FFTW=ON \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install"
          cmake --build build -j $(nproc)
          cmake --install build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: abacus-cuda-bin
          path: install/
          retention-days: 1

  # ── Job 2: 5 个 Matrix 实例并行跑各自的测试套件 ──────────
  gpu-test:
    name: Test ${{ matrix.suite }}
    needs: build
    runs-on: gpu
    if: github.repository_owner == 'deepmodeling'
    container:
      image: ghcr.io/deepmodeling/abacus-cuda
      options: --gpus all
    strategy:
      fail-fast: false
      matrix:
        suite:
          - 11_PW_GPU
          - 12_NAO_Gamma_GPU
          - 13_NAO_multik_GPU
          - 15_rtTDDFT_GPU
          - 16_SDFT_GPU

    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v7

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: abacus-cuda-bin
          path: install/

      - name: Make binary executable
        run: find install/bin -type f -exec chmod +x {} \;

      - name: Test ${{ matrix.suite }}
        run: |
          export PATH="${GITHUB_WORKSPACE}/install/bin:${PATH}"
          cd "tests/${{ matrix.suite }}"
          bash ../integrate/Autotest.sh -n 2 -f CASES_GPU.txt
