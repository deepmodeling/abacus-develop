name: Precommit

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1
        # TODO: Drop "continue-on-error"
        continue-on-error: true
