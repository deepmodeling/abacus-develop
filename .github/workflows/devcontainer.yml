name: Container

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build_container_and_push_cpu:
    runs-on: [self-hosted,cpu]
    if: github.repository_owner == 'deepmodeling'
    strategy:
      matrix:
        dockerfile: ["gnu","intel"]
    env:
      DOCKER_CONFIG: >-
        ${{ runner.temp }}/docker-${{ github.run_id }}-${{ matrix.dockerfile }}
    steps:
      - name: Force Clean Workspace
        run: |
          sudo chattr -i -R ${{ github.workspace }} 2>/dev/null || true
          sudo chown -R $USER:$USER ${{ github.workspace }}
          sudo find ${{ github.workspace }} -mindepth 1 -delete
        
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/deepmodeling/abacus-${{ matrix.dockerfile }}
            dp-harbor-registry.us-east-1.cr.aliyuncs.com/deepmodeling/abacus-${{ matrix.dockerfile }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Registry
        uses: docker/login-action@v4
        with:
          registry: dp-harbor-registry.us-east-1.cr.aliyuncs.com
            # AliCloud automatically mirrors to registry.dp.tech
          username: ${{ secrets.DP_HARBOR_USERNAME }}
          password: ${{ secrets.DP_HARBOR_PASSWORD }}

      - name: Build and Push Container
        uses: docker/build-push-action@v7
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: Dockerfile.${{ matrix.dockerfile }}
          push: true
          cache-from: type=registry,ref=ghcr.io/deepmodeling/abacus-${{ matrix.dockerfile }}:latest
          cache-to: type=inline
 
  build_container_and_push_gpu:
    runs-on: [self-hosted,gpu]
    if: github.repository_owner == 'deepmodeling'
    strategy:
      matrix:
        dockerfile: ["cuda"]
    env:
      DOCKER_CONFIG: >-
        ${{ runner.temp }}/docker-${{ github.run_id }}-${{ matrix.dockerfile }}
    steps:
      - name: Force Clean Workspace
        run: |
          sudo chattr -i -R ${{ github.workspace }} 2>/dev/null || true
          sudo chown -R $USER:$USER ${{ github.workspace }}
          sudo find ${{ github.workspace }} -mindepth 1 -delete
        
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/deepmodeling/abacus-${{ matrix.dockerfile }}
            dp-harbor-registry.us-east-1.cr.aliyuncs.com/deepmodeling/abacus-${{ matrix.dockerfile }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Registry
        uses: docker/login-action@v4
        with:
          registry: dp-harbor-registry.us-east-1.cr.aliyuncs.com
            # AliCloud automatically mirrors to registry.dp.tech
          username: ${{ secrets.DP_HARBOR_USERNAME }}
          password: ${{ secrets.DP_HARBOR_PASSWORD }}

      - name: Build and Push Container
        uses: docker/build-push-action@v7
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: Dockerfile.${{ matrix.dockerfile }}
          push: true
          cache-from: type=registry,ref=ghcr.io/deepmodeling/abacus-${{ matrix.dockerfile }}:latest
          cache-to: type=inline
