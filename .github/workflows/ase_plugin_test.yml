name: Atomic Simulation Environment (ASE) Interface Test

on:
  pull_request:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: Optional reviewed QuantumMisaka/abacuslite ref; empty uses published 1.2.2
        required: false
        default: ''

defaults:
  run:
    shell: bash

jobs:
  test:
    name: abacuslite external
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/deepmodeling/abacus-gnu
    env:
      ABACUS_COMMAND: mpirun -np 2 abacus
      ASE_ABACUS_ASSETS: ${{ github.workspace }}/tests/PP_ORB
      ASE_ABACUS_SOCKET: '1'

    steps:
      - name: Checkout engine PR
        uses: actions/checkout@v7.0.1

      - name: Checkout reviewed plugin candidate
        if: github.event_name == 'workflow_dispatch' && inputs.plugin_ref != ''
        uses: actions/checkout@v7.0.1
        with:
          repository: QuantumMisaka/abacuslite
          ref: ${{ inputs.plugin_ref }}
          path: candidate-plugin
          persist-credentials: false

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: 'latest'
          activate-environment: abacuslite
          python-version: '3.10'

      - name: Install Python dependencies
        shell: bash -l {0}
        run: |
          set -euo pipefail
          conda install -y pip
          pip install numpy scipy matplotlib

      - name: Install abacuslite
        shell: bash -l {0}
        env:
          PLUGIN_REF: ${{ inputs.plugin_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plugin-wheel"
          if [ -n "$PLUGIN_REF" ]; then
            python -m pip install 'build>=1.2'
            python -m build --wheel --outdir "$RUNNER_TEMP/plugin-wheel" candidate-plugin
            git -C candidate-plugin rev-parse HEAD
          else
            python -m pip download --only-binary=:all: --no-deps \
              --dest "$RUNNER_TEMP/plugin-wheel" 'abacuslite==1.2.2'
          fi
          wheels=("$RUNNER_TEMP"/plugin-wheel/*.whl)
          test "${#wheels[@]}" -eq 1
          sha256sum "${wheels[0]}"
          if [ -z "$PLUGIN_REF" ]; then
            actual="$(sha256sum "${wheels[0]}")"
            test "${actual%% *}" = d4675aae2f70b99a6e18882e2c4ecf7f67f57eae10f5ba3e01622e879c6b8caf
          fi
          python -m pip install "${wheels[0]}"
          python -m pip show abacuslite ase numpy seekpath
          python interfaces/ASE_interface/tests/verify_external.py \
            --checkout-root "$GITHUB_WORKSPACE"

      - name: Install external tools from toolchain
        run: |
          sudo apt update && sudo apt install -y xz-utils ninja-build pkg-config
          cd toolchain
          ./install_abacus_toolchain_new.sh --with-dftd4=install --dry-run -j8
          ./scripts/stage4/install_stage4.sh
          cd ..

      - name: Configure & build ABACUS (GNU)
        run: |
          git config --global --add safe.directory "$(pwd)"
          source toolchain/install/setup
          prepend_path CMAKE_PREFIX_PATH ${PEXSI32_ROOT}:${SUPERLU_DIST32_ROOT}:${PARMETIS32_ROOT}:${METIS32_ROOT}:${GKLIB_ROOT}
          rm -rf build
          cmake -B build -G Ninja
          cmake --build build -j2

      - name: Install and attest the built ABACUS executable
        run: |
          built="$GITHUB_WORKSPACE/build/abacus_basic_para"
          test -x "$built"
          cmake --install build
          installed="$(command -v abacus)"
          test -x "$installed"
          built_sha="$(sha256sum "$built")"
          installed_sha="$(sha256sum "$installed")"
          test "${built_sha%% *}" = "${installed_sha%% *}"
          printf 'Built ABACUS: %s %s\n' "$built" "${built_sha%% *}"
          printf 'Installed ABACUS: %s %s\n' "$installed" "${installed_sha%% *}"
          git rev-parse HEAD
          abacus --version

      - name: Run offline harness contracts
        shell: bash -l {0}
        run: |
          set -euo pipefail
          cd interfaces/ASE_interface/tests
          python -m unittest test_external_provenance test_harness_facts \
            test_native_md_fixture test_portable_runner -v

      - name: Run engine-owned integration tests
        shell: bash -l {0}
        run: |
          set -euo pipefail
          python interfaces/ASE_interface/tests/run_engine_compatibility.py \
            --engine "$GITHUB_WORKSPACE/build/abacus_basic_para" \
            --mpi-command 'mpirun -np 2' \
            --assets "$GITHUB_WORKSPACE/tests/PP_ORB" \
            --format latest \
            --wheel "$RUNNER_TEMP"/plugin-wheel/*.whl \
            --report-dir "$RUNNER_TEMP/ase-engine-tests" \
            --engine-ref "$(git rev-parse HEAD)" \
            --python "$(command -v python)"

      - name: Upload ASE failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ase-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ase-engine-tests/**
          if-no-files-found: ignore
          retention-days: 14
