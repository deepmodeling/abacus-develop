name: Atomic Simulation Environment (ASE) Plugin Test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: Optional reviewed QuantumMisaka/abacuslite ref; empty uses published 1.1.0
        required: false
        default: ''

defaults:
  run:
    shell: bash

jobs:
  test:
    name: abacuslite (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/deepmodeling/abacus-gnu
    strategy:
      fail-fast: false
      matrix:
        package: [bundled, external]
    env:
      ABACUS_COMMAND: mpirun -np 2 abacus
      ASE_ABACUS_ASSETS: ${{ github.workspace }}/tests/PP_ORB
      ASE_ABACUS_SOCKET: '1'

    steps:
      - name: Checkout engine PR
        uses: actions/checkout@v7.0.1

      - name: Checkout reviewed candidate
        if: matrix.package == 'external' && inputs.plugin_ref != ''
        uses: actions/checkout@v7.0.1
        with:
          repository: QuantumMisaka/abacuslite
          ref: ${{ inputs.plugin_ref }}
          path: candidate-plugin
          persist-credentials: false

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: 'latest'
          activate-environment: abacuslite
          python-version: '3.10'

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y pip
          pip install numpy scipy matplotlib

      - name: Install bundled plugin
        if: matrix.package == 'bundled'
        shell: bash -l {0}
        run: |
          mkdir -p "$RUNNER_TEMP/bundled-wheel"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/bundled-wheel" \
            interfaces/ASE_interface
          sha256sum "$RUNNER_TEMP"/bundled-wheel/*.whl
          python -m pip install "$RUNNER_TEMP"/bundled-wheel/*.whl

      - name: Build and install candidate wheel
        if: matrix.package == 'external'
        shell: bash -l {0}
        env:
          PLUGIN_REF: ${{ inputs.plugin_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-wheel"
          if [ -n "$PLUGIN_REF" ]; then
            python -m pip install 'build>=1.2'
            python -m build --wheel --outdir "$RUNNER_TEMP/candidate-wheel" candidate-plugin
            git -C candidate-plugin rev-parse HEAD
          else
            python -m pip download --only-binary=:all: --no-deps \
              --dest "$RUNNER_TEMP/candidate-wheel" 'abacuslite==1.1.0'
          fi
          wheels=("$RUNNER_TEMP"/candidate-wheel/*.whl)
          test "${#wheels[@]}" -eq 1
          sha256sum "${wheels[0]}"
          if [ -z "$PLUGIN_REF" ]; then
            actual="$(sha256sum "${wheels[0]}")"
            test "${actual%% *}" = c3e4504e9c9f5bceb69f70c79290e7843037ca72f625c5f66258e14d110f0ff3
          fi
          python -m pip install "${wheels[0]}"
          python -m pip show abacuslite ase numpy seekpath

      - name: Install external tools from toolchain
        run: |
          sudo apt update && sudo apt install -y xz-utils ninja-build pkg-config
          cd toolchain
          ./install_abacus_toolchain_new.sh --with-dftd4=install --dry-run -j8
          ./scripts/stage4/install_stage4.sh
          cd ..

      - name: Configure & Build ABACUS (GNU)
        run: |
          git config --global --add safe.directory `pwd`
          source toolchain/install/setup
          prepend_path CMAKE_PREFIX_PATH ${PEXSI32_ROOT}:${SUPERLU_DIST32_ROOT}:${PARMETIS32_ROOT}:${METIS32_ROOT}:${GKLIB_ROOT}
          rm -rf build
          cmake -B build -G Ninja
          cmake --build build -j2

      - name: Install and Soft Link ABACUS
        run: |
          cmake --install build
          if [ -f /usr/local/bin/abacus_2p ]; then
            ln -sf /usr/local/bin/abacus_2p /usr/local/bin/abacus
          fi
          git rev-parse HEAD
          abacus --version

      - name: Run bundled unit tests
        if: matrix.package == 'bundled'
        shell: bash -l {0}
        run: |
          cd interfaces/ASE_interface/abacuslite
          chmod +x xtest.sh
          ./xtest.sh

      - name: Run provenance regressions
        if: matrix.package == 'external'
        shell: bash -l {0}
        run: |
          cd interfaces/ASE_interface/tests
          python -m unittest test_external_provenance test_harness_facts \
            test_native_md_fixture test_portable_runner -v

      - name: Run engine-owned integration tests
        shell: bash -l {0}
        run: |
          ENGINE_REF="$(git rev-parse HEAD)"
          if [ "${{ matrix.package }}" = external ]; then
            WHEEL_DIR="$RUNNER_TEMP/candidate-wheel"
          else
            WHEEL_DIR="$RUNNER_TEMP/bundled-wheel"
          fi
          python interfaces/ASE_interface/tests/run_engine_compatibility.py \
            --engine /usr/local/bin/abacus \
            --mpi-command 'mpirun -np 2' \
            --assets "$GITHUB_WORKSPACE/tests/PP_ORB" \
            --format latest \
            --wheel "$WHEEL_DIR"/*.whl \
            --report-dir "$RUNNER_TEMP/ase-engine-tests" \
            --engine-ref "$ENGINE_REF" \
            --python "$(command -v python)"

      - name: Upload ASE failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ase-failure-${{ matrix.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ase-engine-tests/**
          if-no-files-found: ignore
          retention-days: 14
