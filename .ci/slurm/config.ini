[site]
name = Open Source Supercomputing Center of SAI
url = https://www.open-sai.com/
acknowledgement = Computing resources were provided by

[remote]
host = c0.sai.ai-4s.com
port = 12022
user = abacususer01
project_root = ~/abacus_gpu_ci

[cluster]
partition = 16V100
mapping_root = /opt/sai_config/mps_mapping.d
disable_nccl_ib = false
poll_seconds = 10

[build]
qos = huge-gpu
nodes = 1
tasks_per_node = 4
gpus_per_node = 4
time_seconds = 3600

[resource.gpu1]
qos = flood-1o2gpu
nodes = 1
tasks_per_node = 1
gpus_per_node = 1
time_seconds = 900
parallelism = 2

[resource.gpu2]
qos = flood-1o2gpu
nodes = 1
tasks_per_node = 2
gpus_per_node = 2
time_seconds = 900
parallelism = 16

[resource.gpu4]
qos = flood-gpu
nodes = 1
tasks_per_node = 4
gpus_per_node = 4
time_seconds = 900
parallelism = 16

[resource.gpu8x2]
qos = flood-gpu
nodes = 2
tasks_per_node = 8
gpus_per_node = 8
time_seconds = 2400
parallelism = 1

