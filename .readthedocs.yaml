# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  # Toolchain for the `latexpdf` output (latex_engine = 'xelatex' in conf.py).
  # Note: none of these come with the default image — each package below
  # fixed a real build failure encountered during local verification.
  apt_packages:
    - texlive-latex-recommended
    - texlive-fonts-recommended
    - texlive-latex-extra      # includes braket.sty
    - texlive-xetex            # xelatex engine
    - latexmk                  # driver behind `make all-pdf`
    - fonts-freefont-otf       # Sphinx xelatex default: FreeSerif/FreeSans/FreeMono
  jobs:
    pre_build:
      # RTD builds PR (external) versions as HTML only, so PDF failures would
      # not surface until post-merge. Run the same latex->PDF chain here as a
      # pre-merge gate. `latexpdf` is a make-mode target, not a -b builder,
      # hence the two-step latex build + make all-pdf.
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ]; then
          sphinx-build -b latex docs/ _latex_prcheck --fail-on-warning \
            && make -C _latex_prcheck all-pdf
        fi

        
# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  # You can configure Sphinx to use a different builder, for instance use the dirhtml builder for simpler URLs
  # builder: "dirhtml"
  # Fail on all warnings to avoid broken references
  fail_on_warning: true

# Optionally build your docs in additional formats such as PDF and ePub
formats:
  - pdf

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
   install:
   - requirements: docs/requirements.txt
